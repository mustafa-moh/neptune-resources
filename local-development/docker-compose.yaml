version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Mount volume at /var/lib/postgresql for Postgres 18+
      - postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d

  # 2. Redis Cache Service
  redis:
    image: redis:latest
    container_name: redis_cache
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # 3. Neptune DXP - Open Edition (Planet9) Service
  neptune:
    image: neptunesoftware/planet9:${NEPTUNE_VERSION}
    container_name: neptune_dxp
    restart: always
    depends_on:
      - db
      - redis
    environment:
      PORT: ${NEPTUNE_PORT}
      INITIAL_ADMIN_PASSWORD: ${NEPTUNE_ADMIN_PASSWORD}
      DB_TYPE: postgresql
      DB_PSQL_HOST: db
      DB_PSQL_PORT: 5432
      DB_PSQL_USER: ${POSTGRES_USER}
      DB_PSQL_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PSQL_DBNAME: ${POSTGRES_DB}
      DB_URI_REDIS: redis://redis:6379
      # Vault configuration
      VAULT_ENABLED: ${VAULT_ENABLED:-true}
      VAULT_PRIVATE_KEY: ${VAULT_PRIVATE_KEY:-/run/vault-keys/vault}
      VAULT_PUBLIC_KEY: ${VAULT_PUBLIC_KEY:-/run/vault-keys/vault.pem}
    ports:
      - "${NEPTUNE_PORT}:${NEPTUNE_PORT}"
    volumes:
      # Bind-mount Vault keypair directory into the container read-only
      - ${VAULT_KEYS_HOST_DIR:-./vault-keys}:/run/vault-keys:ro

volumes:
  postgres_data:
  redis_data:
